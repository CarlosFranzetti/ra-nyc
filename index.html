<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- user-scalable=no removes the double-tap-zoom delay; viewport-fit=cover
         lets the page paint under the notch, with safe-area insets in the CSS. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#080808" />
    <!-- Stops Chrome offering to translate the page, which it was doing on
         every load — usually "Indonesian to English".

         `lang="en"` above is already correct and is not enough on its own.
         Chrome runs its own detector over the visible text and overrides the
         declared language when it disagrees confidently, and almost every word
         on this screen is a proper noun: promoters, party names and DJ aliases
         like "vivaval", "PUFF", "LIONESSA", "Varist". None of those are English
         words, so the detector reaches for whatever language they look most like
         and lands somewhere random. The English here — "going", "events",
         "Low-key" — is a handful of short labels and is outnumbered.

         Suppressing it outright rather than trying to win the argument. The
         cost is that a non-English speaker cannot machine-translate the
         interface, which is a few dozen words of chrome; the benefit is not
         dismissing a banner over the listings every single time the app opens.
         Nothing here is prose, and the names are exactly what a translator
         should leave alone anyway. -->
    <meta name="google" content="notranslate" />
    <!-- Installed, the app runs without an address bar, tab strip or toolbar on
         every platform that supports it: `standalone` covers iOS (via the Apple
         meta below, which predates the manifest and is still what Safari reads)
         and Android; `window-controls-overlay` gives desktop Chrome and Edge a
         plain window with only the system buttons. Nothing here affects a
         normal browser tab — it is opt-in at install time. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- black-translucent lets the page paint behind the status bar; the
         safe-area insets in the CSS keep content out from under the clock. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RA NYC" />
    <link rel="icon" type="image/svg+xml" href="/ra-favicon.svg" />
    <!-- PNG, not the SVG the manifest uses: iOS Safari does not rasterise SVG
         for home-screen icons and silently falls back to a screenshot of the
         page — on the one platform this meta block exists to serve. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/ra-apple-touch.png" />

    <!-- Paint the background before CSS loads, so opening the app never flashes
         white. Themes override this the moment the stylesheet lands. -->
    <style>
      html,
      body,
      #root {
        height: 100%;
        background: #080808;
        color: #fff;
      }
    </style>

    <!-- Flyers come from here on essentially every screen, so pay the DNS and
         TLS cost while the document is still parsing. -->
    <link rel="preconnect" href="https://images.ra.co" crossorigin />
    <!-- Set players are opened often enough to be worth resolving early, but not
         worth a full preconnect. -->
    <link rel="dns-prefetch" href="https://w.soundcloud.com" />
    <link rel="dns-prefetch" href="https://player-widget.mixcloud.com" />
    <link rel="dns-prefetch" href="https://archive.org" />

    <!-- Fonts for the Legible and Condensed typography settings. Link tags
         rather than a CSS @import, which would be render-blocking.

         IBM Plex Sans is fetched at 400 and 600 and nothing else — 400 for
         body copy, 600 because .type-legible's heading rule asks for it and
         Plex actually ships a real SemiBold, unlike Atkinson before it, which
         only shipped Regular and Bold and had the browser fake 600 by
         snapping to the nearer of the two. See index.css for why the face
         changed at all.

         Fjalla One ships exactly one weight, so there is no `wght` axis to
         ask for — the URL below is the whole family. That is deliberate here
         rather than a limitation worked around: see index.css next to
         .type-condensed for why a single-weight face is the right answer in
         this slot and was the wrong one in Anton's. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=Fjalla+One&display=swap"
      media="print"
      onload="this.media='all'"
    />

    <title>RA NYC Events</title>
    <meta
      name="description"
      content="Resident Advisor NYC events in a fast, mobile-friendly list."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="RA NYC Events" />
    <meta
      property="og:description"
      content="Resident Advisor NYC events in a fast, mobile-friendly list."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="RA NYC Events" />
    <meta
      name="twitter:description"
      content="Resident Advisor NYC events in a fast, mobile-friendly list."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

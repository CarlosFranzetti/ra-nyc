<!-- Maskable variant: Android crops home-screen icons to whatever shape the
     launcher uses, so the mark sits inside the safe zone (the middle 80%) and
     the background bleeds to the edges. The plain favicon fills the frame and
     would lose its corners under a circle mask. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" fill="none">
  <rect width="192" height="192" fill="#080808"/>
  <text x="50%" y="53%" dominant-baseline="middle" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="58" fill="#fff">RA</text>
</svg>

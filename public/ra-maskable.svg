<!-- Maskable variant: Android crops home-screen icons to whatever shape the
     launcher uses, so the mark sits inside the safe zone (the middle 80%) and
     the background bleeds to the edges. The plain favicon fills more of the
     frame and would lose its corners under a circle mask. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" role="img" aria-label="RA">
  <rect width="192" height="192" fill="#08090A"/>
  <rect x="40" y="72" width="112" height="66" rx="15" fill="#F2F4F5"/>
  <text x="96" y="106" font-family="Helvetica, Arial, sans-serif" font-weight="700"
        font-size="46" letter-spacing="-0.9" fill="#08090A"
        text-anchor="middle" dominant-baseline="central">RA</text>
</svg>
